<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>message sent — kulani john</title>
    <link rel="stylesheet" href="assets/styles/style.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .thank-you {
            max-width: 480px;
            padding: 0 24px;
        }
        .thank-you h1 {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-transform: lowercase;
        }
        .thank-you p {
            color: var(--text-mid);
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 40px;
        }
        .thank-you a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            text-transform: lowercase;
            transition: color 0.3s;
        }
        .thank-you a:hover {
            color: var(--accent);
        }
    </style>
</head>
<body>
    <div class="thank-you">
        <h1>message sent<span style="color: var(--accent)">.</span></h1>
        <p>thanks for reaching out. i'll get back to you soon.</p>
        <a href="index.html">&larr; back home</a>
    </div>
</body>
</html>
